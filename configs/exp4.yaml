# EXP4: isotope half-life domain. The frozen IAEA ground truth is committed in this
# repo; the prompts file is part of the handoff release.
seed: 42
models: ["anthropic/claude-sonnet-5", "openai/gpt-5.5", "deepseek/deepseek-v4-pro", "qwen/qwen3-235b-a22b-2507"]
system: "You are a nuclear physics assistant. State half-lives with an explicit unit and give the dominant decay mode. Provide a single numeric half-life value."
gt_path: data/reference/isotope_gt.json
prompts_path: handoff/isotope_prompts.json
out_path: handoff/exp4_isotopes_v2.jsonl
reps: [1, 2, 3]
workers: 12
