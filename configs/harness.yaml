# Baseline (condition 1) holdout generation pass.
# Frozen inputs (corpus) are not in this repo: see data/manifests/handoff_missing.yaml.
seed: 42
models: ["anthropic/claude-sonnet-5", "openai/gpt-5.5", "deepseek/deepseek-v4-pro", "qwen/qwen3-235b-a22b-2507"]
system: "You are a materials-chemistry assistant. When you mention a molecule, give its SMILES and molecular formula; when you mention a crystal, give its space group symbol and number. Answer the question directly and concisely."
corpus_path: handoff/corpus_final_v2.json
ckpt_path: handoff/baseline_ckpt.jsonl
rep: 0
workers: 16
log_every: 200
concurrent: true
